name: Build EXE and APK from source ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - Universal_Stream_Control_v0.15_GitHub_Ready_SOURCE.zip
permissions:
  contents: read
jobs:
  tests:
    name: Validate source and run Node tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        shell: bash
        run: |
          test -f Universal_Stream_Control_v0.15_GitHub_Ready_SOURCE.zip
          mkdir src
          unzip -q Universal_Stream_Control_v0.15_GitHub_Ready_SOURCE.zip -d src
          test -f src/server/server.mjs
          test -f src/android/app/build.gradle.kts
          test -f src/windows/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run server and desktop tests
        working-directory: src
        run: bash RUN_TESTS.sh
  windows:
    name: Build unsigned Windows EXE
    runs-on: windows-2022
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        shell: pwsh
        run: |
          Expand-Archive -Path Universal_Stream_Control_v0.15_GitHub_Ready_SOURCE.zip -DestinationPath src -Force
          if (-not (Test-Path src/windows/package.json)) { throw 'Windows source missing' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        working-directory: src/windows
        run: npm install --no-audit --no-fund
      - name: Build renderer
        working-directory: src/windows
        run: npm run build:ui
      - name: Electron smoke test
        working-directory: src/windows
        run: npm run smoke:ui
      - name: Package Windows installer
        working-directory: src/windows
        run: npm run dist:win
      - name: Validate EXE and generate hashes
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src/windows/release/*.exe -ErrorAction Stop)
          if ($files.Count -eq 0) { throw 'EXE not found' }
          $lines = foreach ($file in $files) {
            $stream = [IO.File]::OpenRead($file.FullName)
            try {
              if ($stream.ReadByte() -ne 0x4D -or $stream.ReadByte() -ne 0x5A) { throw 'Invalid EXE signature' }
            } finally { $stream.Dispose() }
            "$( (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($file.Name)"
          }
          $lines | Set-Content src/windows/release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalStream-Windows-EXE-unsigned
          path: |
            src/windows/release/*.exe
            src/windows/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
  android:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: |
          mkdir src
          unzip -q Universal_Stream_Control_v0.15_GitHub_Ready_SOURCE.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK
        working-directory: src/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK and generate hashes
        working-directory: src/android/app/build/outputs/apk/debug
        run: |
          test -f app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app-debug.apk
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalStream-Android-Debug-APK
          path: |
            src/android/app/build/outputs/apk/debug/*.apk
            src/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
